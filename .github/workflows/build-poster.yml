name: Build poster

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-poster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live and image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-lang-german texlive-fonts-recommended lmodern python3 python3-pil poppler-utils
      - name: Check and build
        run: make check
      - name: Render preview
        run: make preview
      - name: Upload poster artifacts for manual runs only
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: poster-build
          path: |
            build/main.pdf
            build/poster-preview.png
          retention-days: 1
