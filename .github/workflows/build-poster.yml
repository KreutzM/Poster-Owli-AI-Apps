name: Build poster

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-lang-german texlive-fonts-recommended lmodern python3 poppler-utils
      - name: Check and build
        run: make check
