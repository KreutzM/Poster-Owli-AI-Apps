name: Build poster

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live and image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-lang-german texlive-fonts-recommended lmodern python3 python3-pil poppler-utils
      - name: Check and build
        run: make check
      - name: Render preview
        run: make preview
      - name: Upload poster artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poster-build
          path: |
            build/main.pdf
            build/poster-preview.png
